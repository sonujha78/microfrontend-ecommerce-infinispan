apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-prefix
  namespace: ecommerce
spec:
  stripPrefix:
    prefixes:
      - /product-catalog
      - /shopping-cart
      - /marketing-landing
      - /checkout-admin
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: ecommerce
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: ecommerce-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: shop.local
      http:
        paths:
          - path: /product-catalog
            pathType: Prefix
            backend:
              service:
                name: product-catalog
                port:
                  number: 80
          - path: /shopping-cart
            pathType: Prefix
            backend:
              service:
                name: shopping-cart
                port:
                  number: 80
          - path: /marketing-landing
            pathType: Prefix
            backend:
              service:
                name: marketing-landing
                port:
                  number: 80
          - path: /checkout-admin
            pathType: Prefix
            backend:
              service:
                name: checkout-admin
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-api
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: host-shell
                port:
                  number: 3000
